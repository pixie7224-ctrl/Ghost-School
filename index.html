<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:#fafafa;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 480px at 12% -8%,#52525b40,transparent),radial-gradient(700px 480px at 100% 0,#3f3f4655,transparent),#111113}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at top,#000,transparent 72%);mask-image:radial-gradient(ellipse at top,#000,transparent 72%)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.top{position:sticky;top:0;z-index:10;background:#18181bcc;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid #ffffff14}
.bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}.brand span:last-child{color:#a1a1aa}
.lg{width:34px;height:34px;border-radius:10px;background:#fafafa;color:#18181b;display:grid;place-items:center}
.rt{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:#27272a;border-radius:10px;padding:3px}.seg button{border:0;background:none;color:#a1a1aa;padding:5px 11px;border-radius:8px;cursor:pointer;font:600 13px system-ui;transition:.2s}.seg button.on{background:#fafafa;color:#18181b}.seg.wide{margin-bottom:14px}.seg.wide button{flex:1;padding:8px}
.pill{display:flex;gap:6px;align-items:center;background:#27272a;border:1px solid #3f3f46;color:#fafafa;border-radius:99px;padding:6px 12px;cursor:pointer;font:600 14px system-ui;transition:.2s}.pill:hover{background:#3f3f46}
.av{border-radius:50%;object-fit:cover;background:#3f3f46;display:inline-grid;place-items:center;font-weight:700;flex:none}
.nav{max-width:1100px;margin:14px auto 0;padding:0 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.nav button{display:flex;gap:7px;align-items:center;background:none;border:1px solid transparent;color:#a1a1aa;border-radius:10px;padding:8px 12px;cursor:pointer;font:600 14px system-ui;white-space:nowrap;transition:.2s}.nav button:hover{color:#fff;background:#27272a}.nav button.on{background:#fafafa;color:#18181b}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:#1f1f23;border:1px solid #ffffff12;border-radius:16px;padding:18px;margin-bottom:12px;animation:up .25s ease}
.btn{background:#3f3f46;color:#fff;border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font:600 15px system-ui;transition:transform .12s,background .2s}
.btn:hover{background:#52525b}.btn:active{transform:scale(.97)}.btn.p,.btn.on{background:#fafafa;color:#18181b}.btn.p:hover{background:#e4e4e7}.btn.d{background:#7f1d1d}.btn.w{width:100%}.btn.ic{padding:9px}
.btn:disabled{opacity:.4;cursor:not-allowed;background:#3f3f46;color:#a1a1aa;transform:none}
input,select,textarea{width:100%;background:#111113;color:#fff;border:1px solid #3f3f46;border-radius:10px;padding:10px;font:inherit;font-size:16px;margin:4px 0 10px}
input:focus,select:focus,textarea:focus{outline:2px solid #a1a1aa}
label{font-size:13px;color:#a1a1aa}.chk{display:flex;gap:10px;align-items:flex-start;color:#e4e4e7;font-size:14px;margin:6px 0}.chk input{width:20px;height:20px;margin:0;flex:none}
.pw{position:relative}.pw input{padding-right:44px}.eye{position:absolute;right:4px;top:5px;background:none;border:0;color:#a1a1aa;padding:8px;cursor:pointer}
.lk{color:#fafafa;text-decoration:underline;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.row .btn{flex:0 0 auto}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.g{background:#fafafa;color:#18181b}.y{background:#a1a1aa;color:#18181b}.m{background:#3f3f46;color:#e4e4e7}
.mut{color:#a1a1aa;font-size:13px}.err{color:#fca5a5;font-size:13px;min-height:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}.grid .card{margin:0;cursor:pointer;transition:transform .15s,border-color .2s}.grid .card:hover{transform:translateY(-3px);border-color:#ffffff40}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-bottom:12px}.grid2 .card{margin:0}
.au{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center;min-height:70vh}.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.1;letter-spacing:-.03em;margin:0 0 12px}
.prof{display:flex;gap:16px;align-items:center}
.chat{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}.bub{background:#27272a;border-radius:12px;padding:8px 12px;max-width:80%;align-self:flex-start}.bub.me{background:#fafafa;color:#18181b;align-self:flex-end}.bub small{display:block;opacity:.6;font-size:11px}
.rl{padding-left:20px;line-height:1.7}.rl li{margin-bottom:8px}
.ovx{overflow-x:auto}.tbl{width:100%;border-collapse:collapse}.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid #3f3f46;text-align:left;white-space:nowrap}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:30;animation:fade .2s}
.md{background:#27272a;border-radius:18px;padding:22px;max-width:500px;width:100%;max-height:88vh;overflow:auto;animation:pop .22s ease}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fafafa;color:#18181b;padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;animation:up .2s}
@keyframes up{from{opacity:0;transform:translateY(8px)}}@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.94)}}
@media(max-width:820px){.au{grid-template-columns:1fr;min-height:0;gap:16px}.nav{position:fixed;bottom:0;left:0;right:0;margin:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:#18181bee;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid #ffffff14;z-index:10}.nav button{flex-direction:column;gap:2px;font-size:10px;padding:6px 9px}main{padding-bottom:96px}}
@media(max-width:520px){.brand{font-size:16px}.lg{width:30px;height:30px}.rt .av{display:none}.card{padding:14px}.prof{flex-direction:column;text-align:center}}
.lg{cursor:pointer;user-select:none}.wob{animation:wob .3s}
@keyframes wob{25%{transform:rotate(-14deg) scale(1.1)}75%{transform:rotate(14deg) scale(1.1)}}
.fly{position:fixed;z-index:99;margin:0;pointer-events:none;animation:fly 2.6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fly{0%{transform:none}15%{transform:translate(0,-30px) scale(1.4) rotate(-15deg)}45%{transform:translate(40vw,45vh) scale(7) rotate(20deg)}70%{transform:translate(70vw,20vh) scale(3) rotate(-25deg)}100%{transform:translate(110vw,-10vh) scale(1);opacity:0}}
#app.boo{animation:boo 2.6s}@keyframes boo{0%,100%{filter:none}20%,60%{filter:invert(1) grayscale(1)}35%{filter:invert(1) grayscale(1) blur(2px)}}
.bo{position:fixed;inset:0;display:grid;place-items:center;font-size:20vw;font-weight:900;z-index:98;pointer-events:none;animation:bo 2.6s forwards}
@keyframes bo{0%,25%{opacity:0;transform:scale(.5)}40%,80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
.stc{padding:14px}.stc h2{font-variant-numeric:tabular-nums}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:52px;height:52px;border:0;border-radius:50%;background:#fafafa;color:#18181b;display:grid;place-items:center;box-shadow:0 8px 22px #000a;cursor:pointer;transition:transform .15s}
.fab:hover{transform:scale(1.07)}.fab:active{transform:scale(.95)}
.chatpop{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:min(360px,92vw);max-height:60vh;overflow:auto;background:#27272a;border:1px solid #ffffff1a;border-radius:16px;padding:14px;z-index:19;animation:pop .2s;box-shadow:0 12px 30px #000a}
@media(max-width:820px){.fab{bottom:calc(78px + env(safe-area-inset-bottom,0px))}.chatpop{bottom:calc(140px + env(safe-area-inset-bottom,0px))}}
select:disabled{opacity:.5}
